# ZMOD plugin: Filament Motion Sensor Switch v3
# Flashforge Adventurer 5M / 5M Pro with ZMOD
# Controls existing [filament_motion_sensor e0_sensor]
#
# IMPORTANT:
# - There is NO automatic sensor enabling.
# - Flexible/soft materials can automatically DISABLE the sensor before print.
# - Rigid materials do not change the current sensor state.

[gcode_macro _FILAMENT_SENSOR_SWITCH_STATE]
variable_last_flexible: 0
gcode:
    # Internal state holder.

[gcode_macro FILAMENT_SENSOR_ON]
description: Enable filament motion sensor manually
gcode:
    SET_FILAMENT_SENSOR SENSOR=e0_sensor ENABLE=1
    RESPOND PREFIX="info" MSG="Filament motion sensor: ON (manual)"

[gcode_macro FILAMENT_SENSOR_OFF]
description: Disable filament motion sensor manually
gcode:
    SET_FILAMENT_SENSOR SENSOR=e0_sensor ENABLE=0
    RESPOND PREFIX="info" MSG="Filament motion sensor: OFF (manual)"

[gcode_macro FILAMENT_SENSOR_TOGGLE]
description: Toggle filament motion sensor ON/OFF manually
gcode:
    {% if printer["filament_motion_sensor e0_sensor"].enabled %}
        SET_FILAMENT_SENSOR SENSOR=e0_sensor ENABLE=0
        RESPOND PREFIX="info" MSG="Filament motion sensor: OFF (manual)"
    {% else %}
        SET_FILAMENT_SENSOR SENSOR=e0_sensor ENABLE=1
        RESPOND PREFIX="info" MSG="Filament motion sensor: ON (manual)"
    {% endif %}

[gcode_macro FILAMENT_SENSOR_STATUS]
description: Show current filament motion sensor state
gcode:
    {% if printer["filament_motion_sensor e0_sensor"].enabled %}
        RESPOND PREFIX="info" MSG="Filament motion sensor: ON"
    {% else %}
        RESPOND PREFIX="info" MSG="Filament motion sensor: OFF"
    {% endif %}

[gcode_macro FILAMENT_SENSOR_PREPARE]
description: Auto-disable motion sensor for flexible filament; MATERIAL=<type>
gcode:
    {% set material = params.MATERIAL|default("")|upper %}

    # Flexible/soft material identifiers.
    # Matching is substring-based so TPU95A, TPU-85A, TPE, REC-FLEX, etc. work.
    {% set is_flexible = (
        "TPU" in material or
        "TPE" in material or
        "FLEX" in material or
        "PEBA" in material or
        "SOFT" in material or
        "RUBBER" in material or
        "REC" in material
    ) %}

    {% if material|length == 0 %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSOR_SWITCH_STATE VARIABLE=last_flexible VALUE=0
        RESPOND PREFIX="warning" MSG="Filament type is empty; sensor state unchanged"
    {% elif is_flexible %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSOR_SWITCH_STATE VARIABLE=last_flexible VALUE=1
        SET_FILAMENT_SENSOR SENSOR=e0_sensor ENABLE=0
        RESPOND PREFIX="info" MSG="Flexible filament detected: {material}. Motion sensor: OFF"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSOR_SWITCH_STATE VARIABLE=last_flexible VALUE=0
        RESPOND PREFIX="info" MSG="Filament: {material}. Motion sensor state unchanged"
    {% endif %}

[gcode_macro FILAMENT_SENSOR_PREPARE_FLEX]
description: Force flexible-material mode and disable motion sensor
gcode:
    SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSOR_SWITCH_STATE VARIABLE=last_flexible VALUE=1
    SET_FILAMENT_SENSOR SENSOR=e0_sensor ENABLE=0
    RESPOND PREFIX="info" MSG="Flexible filament mode forced. Motion sensor: OFF"
